# 新 point 注册时，本模板会复制为 config/generator/<point_id>/tower.toml。
# 每个 Hamiltonian 参数点都应独立检查并修改这里的 rank/member。

[output]
# false 时只保存 overlap CSV；true 时额外保存体积较大的生成后向量 JLD2。
save_generated_vectors = false

[states.G]
name = "G"
family = "standard"
l2 = 0
c2 = 0
rank = 1
member = 1

[states.S]
name = "S"
family = "standard"
l2 = 0
c2 = 0
rank = 2
member = 1

[states.boxS]
name = "box S"
family = "standard"
l2 = 0
c2 = 0
rank = 3
member = 1

[states.dS]
name = "dS"
family = "standard"
l2 = 2
c2 = 0
rank = 1
member = 1

[states.boxdS]
name = "box dS"
family = "standard"
l2 = 2
c2 = 0
rank = 3
member = 1

[states.T]
name = "T"
family = "standard"
l2 = 6
c2 = 0
rank = 1
member = 1

[states.ddS]
name = "ddS"
family = "standard"
l2 = 6
c2 = 0
rank = 2
member = 1

[states.O]
name = "O"
family = "standard"
l2 = 0
c2 = 3
rank = 1
member = 1

[states.J]
name = "J"
family = "standard"
l2 = 2
c2 = 3
rank = 1
member = 1

[states.curlJ]
name = "curl J"
family = "standard"
l2 = 2
c2 = 3
rank = 2
member = 1

[states.boxJ]
name = "box J"
family = "standard"
l2 = 2
c2 = 3
rank = 3
member = 1

[states.dJ]
name = "dJ"
family = "standard"
l2 = 6
c2 = 3
rank = 2
member = 1

[states.epsddJ]
name = "eps ddJ"
family = "standard"
l2 = 6
c2 = 3
rank = 3
member = 1

# adjoint family 用于旧 calc_row_sameang 的 L- → Lambda_z → L+ 检验。
[states.J_other]
name = "J (adjoint sector)"
family = "adjoint"
l2 = 2
c2 = 3
rank = 1
member = 1

[states.curlJ_other]
name = "curl J (adjoint sector)"
family = "adjoint"
l2 = 2
c2 = 3
rank = 2
member = 1

[states.boxJ_other]
name = "box J (adjoint sector)"
family = "adjoint"
l2 = 2
c2 = 3
rank = 3
member = 1

[states.dJ_other]
name = "dJ (adjoint sector)"
family = "adjoint"
l2 = 6
c2 = 3
rank = 2
member = 1

[states.epsddJ_other]
name = "eps ddJ (adjoint sector)"
family = "adjoint"
l2 = 6
c2 = 3
rank = 3
member = 1

[[overlaps]]
name = "S_to_dS"
input = "S"
targets = ["dS"]
target_l = 1
mode = "regular"
required = true

[[overlaps]]
name = "dS_to_scalar_L0"
input = "dS"
targets = ["S", "boxS"]
target_l = 0
mode = "regular"
required = true

[[overlaps]]
name = "dS_to_scalar_L2_subspace"
input = "dS"
targets = ["T", "ddS"]
target_l = 2
mode = "regular"
required = true

[[overlaps]]
name = "boxS_to_scalar_L1"
input = "boxS"
targets = ["dS", "boxdS"]
target_l = 1
mode = "regular"
required = false

[[overlaps]]
name = "ddS_to_scalar_L1"
input = "ddS"
targets = ["dS", "boxdS"]
target_l = 1
mode = "regular"
required = false

[[overlaps]]
name = "J_to_dJ"
input = "J"
targets = ["dJ"]
target_l = 2
mode = "regular"
required = false

[[overlaps]]
name = "dJ_to_J_boxJ"
input = "dJ"
targets = ["J", "boxJ"]
target_l = 1
mode = "regular"
required = false

[[overlaps]]
name = "curlJ_to_epsddJ"
input = "curlJ"
targets = ["epsddJ"]
target_l = 2
mode = "regular"
required = false

[[overlaps]]
name = "J_to_curlJ_same_angular"
input = "J_other"
targets = ["curlJ_other"]
target_l = 1
mode = "same_angular"
ladder = "minus"
required = false

[[overlaps]]
name = "dJ_to_epsddJ_same_angular"
input = "dJ_other"
targets = ["epsddJ_other"]
target_l = 2
mode = "same_angular"
ladder = "minus"
required = false

[[overlaps]]
name = "curlJ_to_J_boxJ_same_angular"
input = "curlJ_other"
targets = ["J_other", "boxJ_other"]
target_l = 1
mode = "same_angular"
ladder = "minus"
required = false
