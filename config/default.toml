# 这是“物理/数值任务配置”，不是 Julia 软件依赖配置。
# 推荐复制为 my_run.toml 后修改，不要为每次实验改动源代码。

[model]
# 单尺寸功能（spectrum/density/scaling/oes/rses）使用 nm1；generator 从 point 读取。
nm1 = 5
# 跨尺寸功能（gap/fss）使用 nm_values。
nm_values = [4, 5]

[hamiltonian]
# H = Uf nf² + Uf0 nf n0 + U0 n0²
Uf = 0.5
Uf0 = 1.8
U0 = 4.5
#     + Vf nf Δnf + Vf0 n0 Δnf + V0 n0 Δn0
Vf = 0.0
Vf0 = 0.4
V0 = 1.0
#     - t(f0† f1 f2 f3 + h.c.) + mu Nf
t = 0.5
# spectrum/density/scaling/纠缠谱直接使用这里的 mu；generator 改从全局 CSV 读取 muc。
# critical 使用自己的固定 mu 网格；fss 使用自己的范围并按 methods 选择处理方式。
mu = 0.05

[solver]
# 每个 (Z,R) 离散对称扇区要求的低能本征态数。
k = 20
# ARPACK 本征求解容差。
eig_tol = 1.0e-8
# 判定能量简并块、量子数接近整数、跨扇区等能副本的三个容差。
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
# 维数不超过该值时用稠密对角化，否则用稀疏 ARPACK。
dense_cutoff = 128
# ARPACK Krylov 子空间相对 k 额外保留的维数。
ncv_extra = 12
# 使用上一个参数点的基态作为下一个参数点的初始向量。
warm_start = true
# BLAS 通常保持 1，避免和 FuzzifiED/Julia 线程互相嵌套。
blas_threads = 1
# 0 表示自动采用 JULIA_NUM_THREADS；也可显式写服务器分配的 CPU 数。
fuzzified_threads = 0 # 0 means JULIA_NUM_THREADS / Threads.nthreads()

[spectrum]
# 只在 [hamiltonian].mu 这一个点求谱；k 是每个离散 (Z,R) sector 的本征态数。
k = 200
# 对下面每个 (L²,C₂) 组合，横向输出最低的 levels_per_block 个不同能级。
l2_values = [0, 2, 6]
c2_values = [0, 3]
levels_per_block = 7
# 必须显式给 rescale 能标；默认 1.0 表示先查看相对基态的原始 gap。
# 对具体参数点，请替换成已经独立确定的 factor，程序不会猜测算符身份来拟合它。
factor = 1.0

[gap]
# 沿用旧 ES_mu.jl，每个 sector 只需少量低能态；同一次求谱提取 scalar 与 J gap。
k = 5
mu_min = 0.0
mu_max = 0.12
mu_count = 13

[density]
# 只需在每个 sector 找基态；沿用旧 particle_density_mu.jl 的 k=3。
k = 3
mu_min = -0.5
mu_max = 0.5
mu_count = 21

[critical]
# 固定 U/V/t，只计算以下 mu 网格，选择所配置 score 的最小点；不调用 Optim。
k = 10
# score_terms/score_metric 属于具体案例，放在 config/critical_profiles/*.toml。
mu_min = 0.0
mu_max = 0.12
mu_count = 9

[fss]
# 默认同时做固定 mu 网格和“固定外层参数、沿 size 追踪 muc”的优化。
# 若只要一种，可写 methods = ["grid"] 或 methods = ["optimize"]。
methods = ["grid", "optimize"]
k = 15
# score_terms/score_metric 属于具体案例，放在 config/fss_profiles/*.toml。
scan_parameter = "Uf0"
scan_values = [1.5, 2.0, 2.5, 3.0, 3.5, 4.0]
mu_min = 0.0
mu_max = 0.12
# anchor size 使用这个宽范围发现网格；更大 size 改用下面的局部细网格。
mu_count = 9
optimize_strategy = "size_continuation"
optimize_anchor_nm = 4
optimize_local_half_width = 0.02
optimize_local_count = 9
optimize_max_expansions = 3
optimize_abs_tol = 1.0e-4
optimize_max_iterations = 60
# always 保留每点完整 wide Brent；adaptive 只在指定尺寸的审计点或异常点运行。
# 旧 FSS 默认仍用 always；耗时的大尺寸扫描可在独立 profile 中启用 adaptive。
optimize_wide_mode = "always"
optimize_wide_adaptive_nm = 6
optimize_wide_audit_first = false
optimize_wide_jump_tol = 0.03
optimize_wide_mu_tol = 5.0e-3
optimize_wide_objective_tol = 1.0e-4

[optimization]
# 公共优化器设置；free/values/bounds/score_terms 放在 optimization_profiles 子 TOML。
k = 70
# auto：一个自由参数用 Brent，两个及以上用旧 NelderMead。
algorithm = "auto"
abs_tol = 1.0e-4
tie_u0_to_uf = true
u0_over_uf = 9.0
penalty = 1.0e6
max_iterations = 200
# free、values、bounds 和 score 都必须由 optimization_profiles 中的案例给出。

[scaling]
# scaling-dimension 图只保留这些 L²/C₂ 范围内的态。
l2_max = 20.0
c2_max = 8.0
# 若不写 factor，程序沿用旧 scaling_dimension.jl 的五条能隙关系计算 factor。
# factor = 0.04  # 取消注释即可改用手动 factor

[generator]
# 全局参数点表：generator 的 nm1、七个非 mu 系数、muc、factor 只从这里选定。
registry = "config/generator_points.csv"
# 每个 point 的 generator_fit.toml/tower.toml 位于 config/generator/<point_id>/。
config_root = "config/generator"
# 共形生成元需要保留更多低能态来识别目标 state catalog。
k = 80
# 保存旧 for_generator_special 使用的 SU(3) adjoint weight sector，供 same-angular 检验。
include_adjoint = true
adjoint_k = 80

[entanglement]
# 实空间切分位置；0.5 是半球。
realspace_x = 0.5
# 只计算总电荷中点附近这些 QA 扇区，以及给定 |2Lz| 上限。
qa_half_window = 2
lz2_cap = 14
# 统计低纠缠能级时使用的相对纠缠能 cutoff。
xi_cut = 10.0

[output]
# 相对路径以 MottJainED 根目录为准，也可写服务器绝对 scratch 路径。
root = "output"
# 可选：普通功能写入 output/<功能>/<run_name>_01/；配置改变后顺延 _02。
# optimization 即使不写，也会自动使用“profile_nm_k_01”这样的可读连续编号。
# run_name = "my_case"
