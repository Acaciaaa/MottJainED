[run]
nm = 6
tol = 1.0e-8
ncv = 18
seed = 20260924
heavy_space_mode = "laughlin13"
output = "output/so3lver/conformal_algebra/n6_projected_scalar_fit_holdout_jt"

[algebra]
# S and O determine the generator direction, scale, and scalar mixed-
# commutator normalization.  J and T are evaluated by the same run but are
# strict holdouts and never enter the generalized eigenproblem.
