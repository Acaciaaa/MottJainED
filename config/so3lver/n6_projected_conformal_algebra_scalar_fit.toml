vacuum_weight = 1.0
dilatation_weight = 1.0
descendant_weight = 1.0
descendant_state_count = 6
factor_lower = 0.005
factor_upper = 0.250
gram_rtol = 1.0e-10
singlet_l0_count = 5
singlet_l2_count = 4
adjoint_l0_count = 4
adjoint_l1_count = 4

[point]
Uf = 0.48
U0 = 4.32
Uf0 = 1.68
Vf = 0.0
Vf0 = 0.3549772487682664
V0 = 0.0
t = 0.5
mu = 0.22881105175318384
