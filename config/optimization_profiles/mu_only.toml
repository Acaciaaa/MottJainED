# 只连续寻找 μc；auto 会选择有界 Brent。
# 这组默认 μ 范围沿用 FSS1.jl，可按具体问题修改。
[optimization]
free = ["mu"]
score_terms = ["ds_s", "dds_ds", "c2_6", "boxs_s", "j", "curlj", "dj_rank3", "t_rank1"]
score_metric = "cost"
algorithm = "auto"
tie_u0_to_uf = true

[optimization.values]
Uf = 0.5
Uf0 = 1.8
U0 = 4.5
Vf = 0.0
Vf0 = 0.4
V0 = 1.0
t = 0.5
mu = 0.05

[optimization.bounds]
mu = [0.0, 0.12]
