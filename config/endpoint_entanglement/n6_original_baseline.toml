# N=6 endpoint entanglement spectra at the retained original-baseline Hamiltonian.
# This profile intentionally does not inherit config/my_run.toml.

[model]
nm1 = 6

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.41
V0 = 0.525
t = 0.5
mu = 0.0 # Endpoint chemical potentials are set explicitly below.

[solver]
k = 2
eig_tol = 1.0e-9
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false
blas_threads = 1

[endpoint_entanglement]
# These are the already selected points on the two plateaus, not fitted critical mu.
mu_left = 0.02
mu_right = 0.22

# Half-system charge and SU(3) Cartan sector.  At N=6, QA=9 gives either
# three fermions per flavor (left) or three charge-3 particles (right).
qa = 9
f3a = 0
f8a = 0

# Common compact root 2LzA=-27 followed by DeltaL=0,1,2,3.
lz2_values = [-27, -25, -23, -21]
left_expected_counts = [1, 3, 9, 22]
right_expected_counts = [1, 1, 2, 3]

# Left: hemisphere real-space cut.  Right: first half of each orbital set.
cut_x = 0.5
nm1_a = 3
nm0_a = 8

# Plotting does not discard smaller positive Schmidt values from the CSV output.
lambda_plot_min = 1.0e-14
plot_xi_max = 25.0

# Density is a gate/diagnostic only: a failed check warns but preserves the spectra.
phase_fraction_min = 0.95
output = "output/endpoint_entanglement/n6_original_baseline"
