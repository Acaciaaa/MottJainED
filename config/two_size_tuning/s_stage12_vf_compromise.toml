# Vf stability probe, stage 12b: perturb Vf around the best measured joint
# S/O compromise with q < 0.15. This is a response-direction test, not a move
# away from the physically preferred Vf=0 model. N=3,4 guide muc only;
# N=5,6 enter matching, and both new N=6 endpoints receive a wide audit.

[hamiltonian]
Uf = 0.46
Uf0 = 1.65
U0 = 4.14
Vf = 0.0
Vf0 = 0.60
V0 = 0.56
t = 0.5
mu = 0.10140013961101

[two_size_tuning]
run_name = "s_stage12_vf_compromise"
output_root = "output/two_size_tuning"

guide_nm_values = [3, 4]
match_nm_values = [5, 6]

scan_parameter = "Vf"
# Reuse the stage-11 Vf=0 result as the central baseline.
scan_values = [-0.05, 0.05]

k = 30
# Keep the historical muc definition; inspect all five per-relation residuals
# in fss_optimize_evaluations.csv in addition to DeltaS/DeltaO and aggregate q.
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"

mu_min = -0.095
mu_max = 0.305
mu_count = 41
optimize_anchor_nm = 4
optimize_local_half_width = 0.02
optimize_local_count = 9
optimize_max_expansions = 3
optimize_abs_tol = 2.0e-5
optimize_max_iterations = 100

optimize_wide_mode = "adaptive"
optimize_wide_adaptive_nm = 6
optimize_wide_audit_first = false
optimize_wide_audit_all = true
optimize_wide_jump_tol = 0.03
optimize_wide_mu_tol = 5.0e-3
optimize_wide_objective_tol = 1.0e-4
