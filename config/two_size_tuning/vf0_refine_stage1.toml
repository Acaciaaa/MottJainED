# 两尺寸调参：优先解决 Vf0 的低值 crossing 与高值稳定区冲突。
#
# 旧扫描已经包含 Vf0 = 0, 0.2, 0.41, 0.7, 1.0；本轮不重复这些点。
# N=3,4 只用于宽范围 muc 搜索和 continuation，最终 matching 严格只用 N=5,6。

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.41
V0 = 0.525
t = 0.5
mu = 0.12177396790686024

[two_size_tuning]
run_name = "vf0_refine_stage1"
output_root = "output/two_size_tuning"

guide_nm_values = [3, 4]
match_nm_values = [5, 6]

scan_parameter = "Vf0"
# 0.08--0.12 检验低值 DeltaS crossing；0.60/0.80 检验 0.7 附近稳定区。
scan_values = [0.08, 0.10, 0.12, 0.60, 0.80]

k = 30
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"

# N=3,4 都做宽范围多谷搜索；N=5 从 N=4 的 muc 续接，N=6 从 N=5 续接。
mu_min = -0.095
mu_max = 0.305
mu_count = 41
optimize_anchor_nm = 4
optimize_local_half_width = 0.02
optimize_local_count = 9
optimize_max_expansions = 3
optimize_abs_tol = 1.0e-4
optimize_max_iterations = 100
