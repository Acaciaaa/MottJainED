# N=7 standard-family generator/tower run at the accepted original-Hamiltonian
# center.  The non-mu couplings exactly match n7_original_audit_auto.toml, so
# the server reuses cache nm7_6ff20bdae301b353 instead of rebuilding matrices.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.41
V0 = 0.525
t = 0.5
mu = 0.1216874050164

[solver]
k = 40
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_original_tower_k40"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 40
mus = [0.1216874050164]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
allow_cache_release = false

[fast_ed_tower]
point_id = "n7_original_muc_k40"
factor = 0.03506318138984893
output_root = "output/fast_ed/generator"
fit_config = "config/generator/n7_original_muc_k40/generator_fit.toml"
tower_config = "config/generator/n7_original_muc_k40/tower.toml"
