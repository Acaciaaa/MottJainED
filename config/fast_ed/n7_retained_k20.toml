# First N=7 scout at the retained stage-8/stage-12 Hamiltonian point.
# The center is a linear N=5 -> N=6 extrapolation. Five nearby values locate
# the valley without launching a full 20--30-evaluation optimizer.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.55
V0 = 0.34
t = 0.5
mu = 0.14625732779985

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_retained_scout"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
mus = [
    0.13625732779985,
    0.14125732779985,
    0.14625732779985,
    0.15125732779985,
    0.15625732779985,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
