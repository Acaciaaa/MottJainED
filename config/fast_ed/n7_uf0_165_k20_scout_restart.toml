# Fresh N=7 run using the previously validated five-point scout workflow.
# Rebuild this Hamiltonian's cache with --force; do not use the old search outputs.
[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.65
U0 = 4.14
Vf = 0.0
Vf0 = 0.55
V0 = 0.34
t = 0.5
mu = 0.14512072184094

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_uf0_165_scout_restart"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
# Center = 2*mu(N6)-mu(N5); it is a guide, not the measured N7 muc.
# N5=0.14128848931940, N6=0.14320460558017.
mus = [
    0.13512072184094,
    0.14012072184094,
    0.14512072184094,
    0.15012072184094,
    0.15512072184094,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
allow_cache_release = false

[scout]
requires_review = true
muc_confirmed = false
# After collecting these five points, inspect the actual spectra, branches and
# boundary before selecting a small refinement grid. No automatic wide optimizer.
