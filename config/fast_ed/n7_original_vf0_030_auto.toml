# Final N=7 local endpoint around the promoted original locator-audit baseline.
# Its N=5/N=6 searches passed continuation and wide-challenger audits. This
# bounded pipeline retires only the independently archived preceding endpoint.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.30
V0 = 0.525
t = 0.5
mu = 0.133599650364705

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_original_vf0_030_auto_scout"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
mus = [
    0.123599650364705,
    0.128599650364705,
    0.133599650364705,
    0.138599650364705,
    0.143599650364705,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
allow_cache_release = false

[pipeline]
name = "n7_original_vf0_030_auto"
state_root = "output/fast_ed/pipelines"
archive_root = "output/fast_ed/archives"
scan_parameter = "Vf0"
scan_value = 0.30
n5_mu = 0.13335812648292
n6_mu = 0.13351914240411
n5_q = 0.1467821225184555
n6_q = 0.08322034491799561
n5_factor = 0.048873430283174535
n6_factor = 0.044361750073739034
n5_delta_s = 1.4232316899353752
n6_delta_s = 1.369251242661579
n5_delta_o = 3.2166715395334773
n6_delta_o = 3.0745533999211356
scout_step = 0.005
fine_step = 0.00025
fit_snap_step = 0.000125
fine_count = 7
max_adaptive_rounds = 3
max_total_mus = 16
mu_min = 0.09
mu_max = 0.18
accept_neighbor_distance = 0.000251
q_fit_improvement_tol = 1.0e-5
max_quantum_error = 5.0e-4
max_copy_split = 2.0e-6
max_factor_relative_jump = 0.05
max_gap_relative_jump = 0.05

# The N=4 anchor has one guide valley and N=5/N=6 local/wide searches agree.
# There is no known competing N=6 valley requiring a targeted guard point.
guard_mus = []

prepare_cpus = 8
prepare_threads = 8
solve_cpus = 8
solve_threads = 8
max_concurrent = 4
control_cpus = 1

# The immediately preceding endpoint has a downloaded, independently verified
# archive. Both center caches and every unrelated Hamiltonian remain protected.
retire_before_start = [
    "config/fast_ed/n7_original_uf0_200_cache_retirement.toml",
]
auto_release = false
