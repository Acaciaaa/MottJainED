# k=30 convergence check for the same N=7 cache.
# Do not submit this profile until the k=20 scan_summary.csv has been inspected.
# If its best point is not 0.14625732779985, replace both mu values below first.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.55
V0 = 0.34
t = 0.5
mu = 0.14625732779985

[solver]
k = 30
eig_tol = 1.0e-8
energy_tol = 1.0e-7
