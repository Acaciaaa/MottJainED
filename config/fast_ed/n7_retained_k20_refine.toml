# Fine N=7 chemical-potential scan after the five-point k=20 scout.
# The Hamiltonian is unchanged.  The range brackets the quadratic estimate
# mu ~= 0.1451 while resolving the rapid DeltaS variation seen in the scout.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.55
V0 = 0.34
t = 0.5
mu = 0.14525

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_retained_refine"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
mus = [
    0.14450,
    0.14475,
    0.14500,
    0.14525,
    0.14550,
    0.14575,
    0.14600,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
