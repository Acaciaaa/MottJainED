# Next N=7 endpoint around the promoted original locator-audit baseline.
# Its N=5/N=6 searches passed continuation and wide-challenger audits. The
# bounded pipeline retires only the independently archived preceding endpoint.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 2.0
U0 = 4.14
Vf = 0.0
Vf0 = 0.41
V0 = 0.525
t = 0.5
mu = 0.12226540150932

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_original_uf0_200_auto_scout"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
mus = [
    0.11226540150932,
    0.11726540150932,
    0.12226540150932,
    0.12726540150932,
    0.13226540150932,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
allow_cache_release = false

[pipeline]
name = "n7_original_uf0_200_auto"
state_root = "output/fast_ed/pipelines"
archive_root = "output/fast_ed/archives"
scan_parameter = "Uf0"
scan_value = 2.0
n5_mu = 0.12312711168687
n6_mu = 0.12255263823517
n5_q = 0.144934837156014
n6_q = 0.08325124867871257
n5_factor = 0.0472322641682251
n6_factor = 0.04237699102820816
n5_delta_s = 1.387618005563944
n6_delta_s = 1.3327838354678343
n5_delta_o = 3.229029868809076
n6_delta_o = 3.08297794027735
scout_step = 0.005
fine_step = 0.00025
fit_snap_step = 0.000125
fine_count = 7
max_adaptive_rounds = 3
max_total_mus = 16
mu_min = 0.08
mu_max = 0.17
accept_neighbor_distance = 0.000251
q_fit_improvement_tol = 1.0e-5
max_quantum_error = 5.0e-4
max_copy_split = 2.0e-6
max_factor_relative_jump = 0.05
max_gap_relative_jump = 0.05

# N=3/4 each found one guide valley and N=5/6 local/wide searches agree.
guard_mus = []

prepare_cpus = 8
prepare_threads = 8
solve_cpus = 8
solve_threads = 8
max_concurrent = 4
control_cpus = 1

# The immediately preceding local endpoint has a downloaded, verified archive.
# Both center caches and every unrelated Hamiltonian remain protected.
retire_before_start = [
    "config/fast_ed/n7_original_vf0_052_cache_retirement.toml",
]
auto_release = false
