# Second Vf0 production point for the bounded N=7 pipeline.
# The extra guard mu measures the audited secondary N=6 valley once at N=7.

[model]
nm1 = 7

[hamiltonian]
Uf = 0.46
Uf0 = 1.834
U0 = 4.14
Vf = 0.0
Vf0 = 0.65
V0 = 0.34
t = 0.5
mu = 0.13906878159784

[solver]
k = 20
eig_tol = 1.0e-8
energy_tol = 1.0e-7
quantum_tol = 2.0e-3
degeneracy_tol = 2.0e-6
dense_cutoff = 128
ncv_extra = 12
warm_start = false

[fast_ed]
run_name = "n7_vf0_065_auto_scout"
cache_root = "output/fast_ed/cache"
result_root = "output/fast_ed/runs"
k = 20
mus = [
    0.12771774983325,
    0.12906878159784,
    0.13406878159784,
    0.13906878159784,
    0.14406878159784,
    0.14906878159784,
]
score_terms = ["ds_s", "j", "curlj", "dj_rank1", "t_rank1"]
score_metric = "q"
allow_cache_release = false

[pipeline]
name = "n7_vf0_065_auto"
state_root = "output/fast_ed/pipelines"
archive_root = "output/fast_ed/archives"
scan_parameter = "Vf0"
scan_value = 0.65
n5_mu = 0.13608278512369
n6_mu = 0.13807344943979
n5_q = 0.15935728084504894
n6_q = 0.11603076339853687
n5_factor = 0.03370620633052472
n6_factor = 0.030630341790555765
n5_delta_s = 1.594727791930946
n6_delta_s = 1.5805622986383947
n5_delta_o = 3.0940247068110023
n6_delta_o = 2.9429301053671573
scout_step = 0.005
fine_step = 0.00025
fit_snap_step = 0.000125
fine_count = 7
max_adaptive_rounds = 3
max_total_mus = 16
mu_min = 0.11
mu_max = 0.18
accept_neighbor_distance = 0.000251
q_fit_improvement_tol = 1.0e-5
max_quantum_error = 5.0e-4
max_copy_split = 2.0e-6
max_factor_relative_jump = 0.05
max_gap_relative_jump = 0.05

# N6 has a distinct, higher local minimum here. Measuring it prevents a local
# continuation result from being mistaken for the N7 global candidate valley.
guard_mus = [0.12771774983325]

prepare_cpus = 8
prepare_threads = 8
solve_cpus = 8
solve_threads = 8
max_concurrent = 4
control_cpus = 1

# Missing old caches are harmless. A present Vf0=0.45 cache is released only
# after its exact identity and locally verified archive receipt both match.
retire_before_start = [
    "config/fast_ed/n7_uf0_165_cache_retirement.toml",
    "config/fast_ed/n7_uf0_200_cache_retirement.toml",
    "config/fast_ed/n7_vf0_045_cache_retirement.toml",
]

# Keep this cache until its final archive has been downloaded and audited.
auto_release = false
